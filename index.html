<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="build-commit" content="__COMMIT_SHA__">
  <title>Radio Dorozhka</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { min-height: 100svh; color: #e8e8e8; }
    #build { position: fixed; z-index: 1; top: max(20px, env(safe-area-inset-top)); left: max(22px, env(safe-area-inset-left)); color: #777; font-size: 11px; letter-spacing: .06em; user-select: text; }
    canvas { display: block; width: 100%; height: 100%; }
    button { position: fixed; left: 50%; bottom: max(40px, calc(env(safe-area-inset-bottom) + 20px)); transform: translateX(-50%); min-width: 160px; min-height: 48px; padding: 14px 27px; border: 1px solid #444; border-radius: 999px; background: #080808; color: #eee; font: inherit; font-size: 12px; letter-spacing: .12em; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:hover { background: #151515; border-color: #777; }
    button:active { background: #222; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 480px) { #build { top: max(17px, env(safe-area-inset-top)); left: 17px; font-size: 10px; } button { bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px)); } }
  </style>
</head>
<body>
  <span id="build" title="Commit __COMMIT_SHA__">__BUILD_ID__</span>
  <canvas id="line" aria-hidden="true"></canvas>
  <button id="new-track" type="button">New Track</button>
  <span id="status" role="status" aria-live="polite"></span>
  <script src="music.js"></script>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('line');
      const context = canvas.getContext('2d');
      const button = document.getElementById('new-track');
      const status = document.getElementById('status');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let width = 0, height = 0, analyser, samples, attachedSession;
      let energy = 0, frameId = null, started = false, changing = false;
      let arrangementTimer, lastFrame = 0;
      const music = new NoirMusic(({song, playing, error}) => {
        if (playing && music.session !== attachedSession) {
          if (!analyser) {
            analyser = music.context.createAnalyser();
            analyser.fftSize = 1024;
            samples = new Float32Array(analyser.fftSize);
          }
          // Analyse a parallel branch so the original output level remains unchanged.
          music.session.master.connect(analyser);
          attachedSession = music.session;
          clearTimeout(arrangementTimer);
          arrangementTimer = setTimeout(nextArrangement, 32 * 4 * 60000 / song.bpm);
          started = true;
          button.dataset.track = song.id;
          button.dataset.audioState = music.context.state;
          status.textContent = 'Playing a new procedural track.';
        }
        if (error) {
          status.textContent = error;
          button.title = 'Audio could not start. Press New Track to try again.';
        } else { button.removeAttribute('title'); }
      });

      function nextArrangement() {
        if (!started || changing) return;
        music.newTrack();
      }
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (reducedMotion.matches) draw(0);
      }
      function draw(time) {
        frameId = null;
        // Keep the visual lightweight; sound scheduling is independent of animation.
        if (!reducedMotion.matches && time - lastFrame < 1000 / 30) {
          frameId = requestAnimationFrame(draw); return;
        }
        lastFrame = time;
        context.clearRect(0, 0, width, height);
        if (analyser && music.context.state === 'running') {
          analyser.getFloatTimeDomainData(samples);
          let sum = 0;
          for (const value of samples) sum += value * value;
          energy += (Math.min(1, Math.sqrt(sum / samples.length) * 12) - energy) * .35;
        } else { energy *= .95; }
        const left = width * .12, length = width * .76, points = Math.max(24, Math.min(110, Math.round(length / 11)));
        const center = height * .48;
        const amplitude = Math.min(height * .12, 74) * (reducedMotion.matches ? .28 : .23 + energy * 1.9);
        context.beginPath();
        for (let i = 0; i <= points; i++) {
          const edge = Math.sin(Math.PI * i / points);
          const jag = Math.sin(i * 2.31 + .4) * .55 + Math.sin(i * 4.17) * .45;
          const audio = samples && !reducedMotion.matches ? samples[Math.floor(i / points * (samples.length - 1))] * 3 : 0;
          const y = center + (jag + audio) * amplitude * edge;
          if (i === 0) context.moveTo(left, y); else context.lineTo(left + i / points * length, y);
        }
        context.strokeStyle = '#dedede'; context.lineWidth = 1.15;
        context.lineJoin = 'miter'; context.stroke();
        if (!document.hidden && !reducedMotion.matches) frameId = requestAnimationFrame(draw);
      }
      function animate() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastFrame = -Infinity;
        if (reducedMotion.matches) draw(0); else if (!document.hidden) frameId = requestAnimationFrame(draw);
      }
      button.addEventListener('click', async () => {
        if (changing) return;
        changing = true;
        try {
          // Resume synchronously inside this gesture, including after a device interruption.
          const audio = music.ensureContext();
          const resumed = audio.resume();
          music.newTrack();
          await resumed;
        } catch {
          status.textContent = 'Audio could not start. Press New Track to try again.';
          button.title = status.textContent;
        } finally { changing = false; }
      });
      window.addEventListener('resize', resize);
      reducedMotion.addEventListener('change', animate);
      document.addEventListener('visibilitychange', animate);
      window.addEventListener('pagehide', () => { clearTimeout(arrangementTimer); music.stop(); });
      window.addEventListener('pageshow', event => {
        if (event.persisted) { started = false; attachedSession = null; animate(); }
      });
      resize(); animate();
    })();
  </script>
</body>
</html>
