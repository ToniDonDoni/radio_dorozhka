<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000">
<meta name="build-commit" content="__COMMIT_SHA__"><title>Radio Dorozhka</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#eee}#scene,canvas{position:absolute;inset:0;display:block;width:100%;height:100%}#build{position:fixed;z-index:2;top:max(22px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));font-size:10px;letter-spacing:.12em;color:#777;user-select:text;display:flex;gap:10px}.controls{position:fixed;z-index:2;right:max(28px,env(safe-area-inset-right));bottom:max(30px,calc(env(safe-area-inset-bottom) + 16px));display:flex;flex-direction:column;align-items:flex-end;gap:13px}#track-info{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10px;line-height:1.4;letter-spacing:.08em;color:#aaa;white-space:nowrap}#track-info[hidden]{display:none}#track-bpm{color:#777;font-size:9px}button{min-width:154px;min-height:48px;padding:14px 24px;border:1px solid #444;border-radius:999px;background:#080808;color:#eee;font:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:hover{background:#151515;border-color:#777}button:focus-visible{outline:2px solid white;outline-offset:5px}button:active{background:#222}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@media(max-width:480px){#build{left:16px;top:18px;font-size:9px;display:block;width:96px;line-height:1.8}.controls{right:16px;bottom:24px}button{min-width:138px;font-size:11px;padding:14px 18px;letter-spacing:.08em}}
</style></head>
<body data-visual="dust" data-motion="up"><div id="scene" aria-hidden="true"></div><span id="build" title="Commit __COMMIT_SHA__">__BUILD_ID__</span><div class="controls"><output id="track-info" aria-live="polite" hidden><span id="track-name"></span><span id="track-bpm"></span></output><button id="new-track" type="button">New Dorozhka</button></div><span id="status" role="status" aria-live="polite"></span>
<script src="music.js"></script><script>window.createVisual = host => {
  const canvas = document.createElement('canvas'); host.append(canvas);
  const ctx = canvas.getContext('2d', {alpha: false});
  let dpr = 1;
  document.body.dataset.renderer = 'Canvas / Particles';
  return {
    resize(width, height, scale) {
      dpr = scale; canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },
    draw({width, height, offset, energy, time, hash, pathX}) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height);
      const first = Math.floor((offset - 60) / 3.2), last = Math.ceil((offset + height + 60) / 3.2);
      ctx.beginPath();
      for (let y = -48; y < height + 48; y += 4) {
        const x = pathX(y + offset, width);
        if (y === -48) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      // Saturated cobalt emission: the core stays blue instead of bleaching white.
      ctx.shadowColor = 'rgba(0,35,255,.9)';
      ctx.shadowBlur = 22 + energy * 8;
      ctx.strokeStyle = 'rgba(0,24,220,.19)';
      ctx.lineWidth = 9 + energy * 5; ctx.stroke();
      ctx.shadowBlur = 9;
      ctx.strokeStyle = 'rgba(8,48,255,.43)';
      ctx.lineWidth = 3.2 + energy * 1.8; ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(24,79,255,.6)'; ctx.lineWidth = .9; ctx.stroke();
      // A world-space strip of deterministic particles: old grains leave at the top,
      // new grains enter at the bottom, and a sparse outer cloud carries depth.
      for (let row = first; row <= last; row++) {
        for (let j = 0; j < 18; j++) {
          const id = row * 23 + j, r = hash(id + 37.8), r2 = hash(id * 1.77 + 2.8);
          const worldY = row * 3.2 + r2 * 3.2, y = worldY - offset;
          const center = pathX(worldY, width);
          const fringe = j > 14;
          const spread = fringe ? 15 + r * 34 : 2.4 + energy * 2.4;
          const gaussian = (hash(id * 3.1) + hash(id * 5.7) + hash(id * 2.8) - 1.5) * 1.8;
          const drift = fringe ? Math.sin(time * .5 + id * .7) * (3 + r * 5) : 0;
          const x = center + gaussian * spread + drift;
          const size = fringe ? .55 + r2 * .9 : .65 + r2 * 1.3;
          const alpha = fringe ? .08 + r * .23 : .3 + r * .66;
          const green = fringe ? 30 : Math.round(66 + r2 * 34);
          const blue = fringe ? 190 : 255;
          ctx.fillStyle = `rgba(${fringe ? 4 : 24},${green},${blue},${alpha.toFixed(2)})`;
          ctx.fillRect(x, y, size, size);
        }
      }
    }
  };
};
</script><script>(() => {
  'use strict';
  const button = document.getElementById('new-track');
  const status = document.getElementById('status');
  const trackInfo = document.getElementById('track-info');
  const trackName = document.getElementById('track-name');
  const trackBpm = document.getElementById('track-bpm');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const view = window.createVisual(document.getElementById('scene'));
  let analyser, samples, attached, timer, busy = false;
  let energy = 0, offset = 230, previousTime = null, frameId = null, frame = 0;
  const music = new NoirMusic(({song, playing, error}) => {
    if (playing && music.session !== attached) {
      if (!analyser) {
        analyser = music.context.createAnalyser(); analyser.fftSize = 512;
        samples = new Float32Array(analyser.fftSize);
      }
      music.session.master.connect(analyser); attached = music.session;
      button.dataset.track = song.id;
      button.dataset.audioState = music.context.state;
      trackName.textContent = song.profile.name;
      trackBpm.textContent = `${song.bpm} BPM`;
      trackInfo.hidden = false;
      clearTimeout(timer); timer = setTimeout(() => music.newTrack(), 32 * 4 * 60000 / song.bpm);
      status.textContent = 'Playing a new procedural track.';
    }
    if (!playing) trackInfo.hidden = true;
    if (error) { status.textContent = error; button.title = 'Press New Dorozhka to retry audio.'; }
    else button.removeAttribute('title');
  });
  const hash = n => { const x = Math.sin(n * 127.1 + 17.31) * 43758.5453123; return x - Math.floor(x); };
  // Vertices belong to world coordinates. Subtracting the travelled distance makes
  // existing corners move up and introduces new geometry below, without a short loop.
  function nodeX(index, width) {
    const narrow = width < 600;
    const span = Math.min(130, width * (narrow ? .12 : .23));
    // Reserve the right-hand control column even on narrow phone screens.
    const center = narrow ? Math.min(width * .43, width - 174 - span * 1.32) : width * .5;
    return center + span * ((hash(index) - .5) * 1.14 + Math.sin(index * .37) * .48 + Math.sin(index * .091) * .27);
  }
  function pathX(worldY, width) {
    const index = Math.floor(worldY / 42), t = worldY / 42 - index;
    return nodeX(index, width) * (1 - t) + nodeX(index + 1, width) * t;
  }
  function resize() {
    view.resize(innerWidth, innerHeight, Math.min(devicePixelRatio || 1, 1.75));
    if (reduced.matches) draw(0);
  }
  function draw(time) {
    frameId = null;
    const delta = previousTime === null ? 0 : Math.min(.06, (time - previousTime) / 1000);
    previousTime = time;
    if (!reduced.matches) offset += delta * 45;
    if (analyser && music.context.state === 'running') {
      analyser.getFloatTimeDomainData(samples);
      let sum = 0; for (const sample of samples) sum += sample * sample;
      energy += (Math.min(.95, Math.sqrt(sum / samples.length) * 11) - energy) * .18;
    } else { energy *= .95; }
    view.draw({width: innerWidth, height: innerHeight, offset, time: time / 1000,
      energy: reduced.matches ? 0 : energy, hash, nodeX, pathX});
    if (++frame % 15 === 0 || reduced.matches) {
      document.body.dataset.offset = offset.toFixed(1);
      document.body.dataset.frames = String(frame);
    }
    document.body.dataset.visualState = 'running';
    if (!document.hidden && !reduced.matches) frameId = requestAnimationFrame(draw);
  }
  function animate() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    previousTime = null; frameId = null;
    if (reduced.matches) draw(0); else if (!document.hidden) frameId = requestAnimationFrame(draw);
  }
  button.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    try {
      const audio = music.ensureContext(), resumed = audio.resume();
      music.newTrack(); await resumed;
    } catch { status.textContent = 'Audio could not start. Press New Dorozhka to try again.'; button.title = status.textContent; }
    finally { busy = false; }
  });
  addEventListener('resize', resize);
  reduced.addEventListener('change', animate);
  document.addEventListener('visibilitychange', animate);
  addEventListener('pagehide', () => { clearTimeout(timer); music.stop(); });
  addEventListener('pageshow', event => { if (event.persisted) { attached = null; animate(); } });
  resize(); animate();
})();
</script></body></html>
