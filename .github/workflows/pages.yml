name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the selected commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected commit and its history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sources
        run: node scripts/check.mjs
      - name: Build one HTML page with commit identification
        run: node scripts/build.mjs
      - name: Upload the page
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish the page
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
